_schema-version: 3.3.0
ID: LowValuePRtoPO
description: A simple CAP project.
version: 1.0.0
modules:
- name: LowValuePRtoPO-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: LowValuePRtoPO-auth
  - name: LowValuePRtoPO-db
  - name: LowValuePRtoPO-connectivity
  - name: LowValuePRtoPO-destination
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: LowValuePRtoPO-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: LowValuePRtoPO-db
  parameters:
    buildpack: nodejs_buildpack
- name: LowValuePRtoPO
  type: approuter.nodejs
  path: app/router
  requires:
  - name: srv-api
    group: destinations
    properties:
      forwardAuthToken: true
      name: srv-api
      url: ~{srv-url}
  - name: LowValuePRtoPO-auth
  - name: LowValuePRtoPO-destination
  - name: LowValuePRtoPO-html5-runtime
  - name: LowValuePRtoPO-portal
  provides:
  - name: app-api
    properties:
      app-protocol: ${protocol}
      app-uri: ${default-uri}
  parameters:
    disk-quota: 256M
    keep-existing-routes: true
    memory: 256M
- name: LowValuePRtoPO-app-deployer
  type: com.sap.application.content
  path: gen
  requires:
  - name: LowValuePRtoPO-auth
  - name: srv-api
  - name: LowValuePRtoPO-html5-repo-host
    parameters:
      config:
        HTML5Runtime_enabled: true
      content-target: true
  build-parameters:
    build-result: app/
    requires:
    - artifacts:
      - comfortescuelowvalueprtopoconfig.zip
      name: comfortescuelowvalueprtopoconfig
      target-path: app/
    - artifacts:
      - prruns.zip
      name: prruns
      target-path: app/
- name: LowValuePRtoPO-portal-deployer
  type: com.sap.application.content
  path: app/portal
  requires:
  - name: LowValuePRtoPO-portal
    parameters:
      content-target: true
      service-key:
        config:
          content-endpoint: developer
        name: LowValuePRtoPO-portal-key
  - name: LowValuePRtoPO-auth
  - name: LowValuePRtoPO-html5-repo-host
  - name: LowValuePRtoPO-app-deployer
  deployed-after:
  - LowValuePRtoPO-app-deployer
- name: comfortescuelowvalueprtopoconfig
  type: html5
  path: app/config
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: prruns
  type: html5
  path: app/prruns
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: LowValuePRtoPO-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
        redirect-uris:
        - https://*~{app-api/app-uri}/**
      tenant-mode: dedicated
      xsappname: LowValuePRtoPO-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
  processed-after:
  - LowValuePRtoPO-messaging
  requires:
  - name: app-api
- name: LowValuePRtoPO-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: LowValuePRtoPO-connectivity
  type: org.cloudfoundry.managed-service
  parameters:
    service: connectivity
    service-plan: lite
- name: LowValuePRtoPO-destination
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
    service: destination
    service-plan: lite
- name: LowValuePRtoPO-html5-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host
- name: LowValuePRtoPO-html5-runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime
- name: LowValuePRtoPO-portal
  type: org.cloudfoundry.managed-service
  parameters:
    service: portal
    service-plan: standard
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
